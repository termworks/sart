# bootart VM input lock, schema v2
#
# Fields (pipe-separated):
# id|status|url|sha256|format|arch|filename|kernel_member|initramfs_member|download_bytes|max_virtual_bytes|max_run_bytes|max_file_bytes|max_log_bytes|max_evidence_bytes
#
# A row is fetchable only when status=verified and sha256 is exactly 64
# lowercase hexadecimal characters. Verified rows also require independently
# reviewed positive byte values for all six resource fields. Blocked rows use
# UNRESOLVED for every resource field, so no guessed cap can become executable
# policy. download_bytes is the exact immutable input length. For qcow2,
# max_virtual_bytes caps reported guest geometry; for ISO it caps the locked
# optical-medium length. max_run_bytes is the aggregate retained run budget,
# while max_file_bytes, max_log_bytes, and max_evidence_bytes are narrower
# artifact ceilings. ISO rows name kernel/initramfs members. Real-guest qcow2
# rows use `-|-`; their immutable base is never attached directly, only through
# a private overlay.
