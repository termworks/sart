[package]
name = "bootart"
version = "0.1.0"
edition = "2024"
description = "Minimal Linux ASCII boot animation"
license = "MIT"
readme = "README.md"
publish = false
autobins = false
autoexamples = false
# Refuse Cargo's implicit build-script discovery. All shipped resources are
# Rust literals in the single product ELF; a custom-build target is forbidden.
build = false

[features]
default = []
# Compiles injected alternate-root mutation seams for tests only. The shipped
# binary never enables this feature while installer/VM acceptance gates remain.
installer-test-seams = []

[[bin]]
name = "bootart"
path = "src/main.rs"

[[test]]
name = "installer_tests"
path = "tests/installer_tests.rs"
required-features = ["installer-test-seams"]

[lib]
name = "bootart"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ruzstd = "0.8.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
