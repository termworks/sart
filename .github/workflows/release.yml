name: release publication locked

# Deliberately manual and non-publishing. The repository has no supported
# adapter pair yet, so CI must not upload artifacts merely because a GitHub
# release object exists. Replace this lock only after `make release-readiness`
# can pass with reviewed immutable VM inputs and all exact proof lanes.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publication-locked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publication while adapter evidence is incomplete
        run: |
          echo 'Release publication is locked: no adapter pair is ProvenSupported.' >&2
          echo 'Required local gate: make release-readiness' >&2
          exit 1
